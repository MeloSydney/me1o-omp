setupVersion: 3
modelRoles:
  advisor: magpie/group/heavy
  smol: magpie/group/heavy
  default: magpie/group/light
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - subagents
    - usage
    - token_total
    - cost
    - context_pct
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
  renderSvg: true
  reactions: true
  mouse: false
display:
  showTokenUsage: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
bash:
  allowCompoundCommands: true
security:
  enabled: false
task:
  eager: preferred
  disabledAgents: []
commands:
  enableClaudeUser: false
dev:
  autoqaConsent: granted
ttsr:
  enabled: false
hideThinkingBlock: true
autoResume: true
error:
  notify: "on"
compaction:
  idleEnabled: true
steeringMode: all
followUpMode: all
ask:
  timeout: 60
theme:
  dark: dark-forest
retry:
  fallbackChains:
    web/parallel:
      - web/parallel
marketplace:
  autoUpdate: auto
power:
  sleepPrevention: idle
